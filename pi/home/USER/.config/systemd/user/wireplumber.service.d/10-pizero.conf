[Unit]
StartLimitIntervalSec=0

[Service]
Restart=always
RestartSteps=5
RestartMaxDelaySec=60
RestartSec=2
# No real-time scheduling for WirePlumber (pipewire itself keeps it via rtkit).
# Bluetooth audio runs in WirePlumber's data loop; on a single-core Zero a
# Bluetooth connect/disconnect can keep that thread busy for >200 ms, and the
# kernel then SIGKILLs a real-time thread (RLIMIT_RTTIME), cutting all audio.
Environment=DISABLE_RTKIT=1
