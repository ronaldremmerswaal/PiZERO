# PiZERO Speakers: run the graph at 44.1 kHz (CD / AirPlay / USB DAC native
# rate) and allow 48 kHz where hardware needs it. A larger quantum keeps the
# single-core ARMv6 from underrunning when Bluetooth (48 kHz) is resampled.
context.properties = {
    default.clock.rate          = 44100
    default.clock.allowed-rates = [ 44100 48000 ]
    default.clock.quantum       = 2048
    default.clock.max-quantum   = 4096
}
