# PiZERO Speakers: appliance-style PipeWire/WirePlumber setup.
wireplumber.profiles = {
  main = {
    # Headless (linger, no seat): Bluetooth devices must be visible without
    # an active logind session.
    monitor.bluez.seat-monitoring = disabled
    # Do not restore the previously selected default node, so the USB DAC
    # always wins by priority when it is present.
    hooks.default-nodes.state = disabled
    # A speaker has no camera: skip the v4l2 monitors and their CPU cost.
    hardware.video-capture = disabled
    monitor.alsa-midi.monitoring = disabled
  }
}

wireplumber.settings = {
  # Never switch a speaker into the phone-call (HFP) profile.
  bluetooth.autoswitch-to-headset-profile = false
  # New output devices start at full volume; AirPlay/Spotify/AVRCP and the
  # speaker's own knob then set the loudness.
  device.routes.default-sink-volume = 1.0
}

monitor.bluez.properties = {
  # This box is a Bluetooth loudspeaker: only accept audio streams.
  bluez5.roles = [ a2dp_sink ]
  # SBC is the cheapest codec on an ARMv6 core and every sender supports it.
  bluez5.codecs = [ sbc ]
}

monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_output.usb-.*" } ]
    actions = {
      update-props = {
        priority.session  = 3000
        # Bigger ALSA periods/headroom: the Zero W is easily starved, which
        # shows up as xruns in Spotify and AirPlay playback.
        api.alsa.period-size = 1024
        api.alsa.headroom    = 4096
      }
    }
  }
  {
    matches = [ { node.name = "~alsa_output.platform-.*hdmi.*" } ]
    actions = { update-props = { priority.session = 500 } }
  }
]
