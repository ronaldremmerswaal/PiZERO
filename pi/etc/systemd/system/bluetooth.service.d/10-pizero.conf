# PiZERO Speakers: always restart bluetoothd and never give up.
# The adapter is powered and (un)locked by pizero-bluetooth-radio.service,
# which runs after bluetoothd is up instead of blocking its activation.
[Unit]
StartLimitIntervalSec=0

[Service]
Restart=always
RestartSteps=5
RestartMaxDelaySec=60
RestartSec=3
