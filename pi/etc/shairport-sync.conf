// Shairport Sync configuration - PiZERO Speakers
// AirPlay 1 receiver writing into the Linux audio server (PipeWire) via the PulseAudio API.
general =
{
    name = "@SPEAKER_NAME@";
    output_backend = "pa";

    // Weak 2.4 GHz link on a single-core ARMv6: tolerate a little more
    // drift/jitter before correcting, which avoids constant resampling.
    drift_tolerance_in_seconds = 0.004;
    resync_threshold_in_seconds = 0.060;
    audio_backend_buffer_desired_length_in_seconds = 0.35;
    audio_backend_buffer_interpolation_threshold_in_seconds = 0.075;

    // Speaker-friendly volume: a fresh sender starts quietly rather than at
    // the last (possibly very loud) level.
    ignore_volume_control = "no";
    volume_range_db = 60;
    default_airplay_volume = -24.0;
    high_threshold_airplay_volume = -16.0;
    high_volume_idle_timeout_in_minutes = 180;
};

// Any sender may take over (phone app switched, laptop grabs it back, ...).
sessioncontrol =
{
    allow_session_interruption = "yes";
    session_timeout = 20;
    active_state_timeout = 10.0;
};

pa =
{
    application_name = "PiZERO Speakers (AirPlay)";
};

diagnostics =
{
    log_output_to = "syslog";
    statistics = "no";
};
